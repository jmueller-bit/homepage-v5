<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/logos/alz-logo.png" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/logos/alz-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <meta name="theme-color" content="#FBF7EF" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="de_AT" />
    <meta property="og:site_name" content="Astrid Lindgren Zentrum" />
    <meta property="og:image" content="/images/opt/og-alz.jpg" />
    <script>
      // Erstes Bild des Startseiten-Bands früh laden (größtes Element im ersten Sichtbereich)
      if (location.pathname === '/') {
        var l = document.createElement('link');
        l.rel = 'preload';
        l.as = 'image';
        l.type = 'image/webp';
        l.setAttribute('imagesrcset', '/images/alz/band/lesen-640.webp 640w, /images/alz/band/lesen-1240.webp 1240w');
        l.setAttribute('imagesizes', '100vw');
        l.setAttribute('fetchpriority', 'high');
        document.head.appendChild(l);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
